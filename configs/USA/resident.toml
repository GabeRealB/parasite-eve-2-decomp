# Assets embedded in the resident images (main, gameplay, title), whose splat configs are written by hand rather
# than generated from overlays.toml. The objects use overlays.toml's form, offsets into the image:
#
#   { kind = "model", at = <first array>, in_c = true }, { kind = "modelSource", at = <its TmdSource record> }
#
# A model declared here is cataloged like an overlay's (tools/peassets/pkg_model.declared_records), and where it
# is `in_c` the build writes its arrays' initializers (`<name>_skeleton.inc`, `_partVerts`, `_verts`, `_normals`,
# `_stream`; tools/buildsteps/gen_model_inc.py).

[gameplay]
load_addr = 0x80093800
objects = [
  { kind = "model", at = "0x7E6D0", in_c = true },          # gEffectBulletCasingModel
  { kind = "modelSource", at = "0x7E7C8" },
  { kind = "model", at = "0x7E7EC", in_c = true },          # gEffectRifleCasingModel
  { kind = "modelSource", at = "0x7E8E4" },
  { kind = "model", at = "0x7E908", in_c = true },          # gEffectP229CasingModel
  { kind = "modelSource", at = "0x7EA00" },
  { kind = "model", at = "0x7EA24", in_c = true },          # gEffectShotgunShellCasingModel
  { kind = "modelSource", at = "0x7EB1C" },
  { kind = "model", at = "0x7EB40", in_c = true },          # gEffectThrownModel91
  { kind = "modelSource", at = "0x7ECB8" },
]
