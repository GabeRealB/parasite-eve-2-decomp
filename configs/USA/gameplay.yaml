# Load address: 0x80093800  size: 0x81F69 (532329)
name: Gameplay Overlay
sha1: 6bc1c60a5d58025bf670c41a8ab3050a52cf4ac4
options:
  basename: gameplay
  target_path: assets/USA/pe2pkg/gameplay.pe2pkg
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/USA/gameplay
  src_path: src/gameplay
  build_path: build/USA
  hasm_in_src_path: True

  ld_script_path: linkers/USA/gameplay.ld

  # Flat pe2pkg overlay: no PS-X EXE header. Layout is
  #   header/rodata → .text → trailing data
  # so section_order must keep .rodata before .text before .data.
  migrate_rodata_to_functions: True
  find_file_boundaries: False
  pair_rodata_to_text: False

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  # Main-exe import VRAM (absolute:True). Must end at the overlay load
  # address so it does not overlap this file's VRAM (splat'd alone, no
  # exclusive_ram_id — same as title.yaml).
  global_vram_start: 0x80010000
  global_vram_end: 0x80093800

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  symbol_addrs_path:
    - configs/USA/sym.gameplay.txt
    - configs/USA/sym.gameplay.imports.txt
  reloc_addrs_path:
    - configs/USA/rel.gameplay.txt

  undefined_funcs_auto_path: linkers/USA/undefined_funcs_auto.gameplay.txt
  undefined_syms_auto_path: linkers/USA/undefined_syms_auto.gameplay.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True
  # File ends at an unaligned size (0x81F69); do not pad sections to align.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

segments:
  - name: gameplay
    type: code
    start: 0x0
    vram: 0x80093800
    align: 4
    subalign: 4
    # Not exclusive_ram_id: this yaml is splat'd alone (not with main).
    # Runtime still loads at 0x80093800 (main BSS), replacing title.
    subsegments:
      # Rodata file splits from splat (GCC jtbl 8-align remainder changes).
      # Names are unique (not shared with the c TUs) so migrate_rodata_to_functions
      # does not treat these as dotted siblings.
      - [0x0, rodata, header]
      - [0xD4, rodata, rodata_D4]
