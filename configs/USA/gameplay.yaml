  # Main-exe import VRAM (absolute:True). Must end at the overlay load
  # address so it does not overlap this file's VRAM (splat'd alone, no
  # exclusive_ram_id — same as title.yaml).
  global_vram_start: 0x80010000
  global_vram_end: 0x80093800

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  symbol_addrs_path:
    - configs/USA/sym.gameplay.txt
    - configs/USA/sym.gameplay.imports.txt
  reloc_addrs_path:
    - configs/USA/rel.gameplay.txt

  undefined_funcs_auto_path: linkers/USA/undefined_funcs_auto.gameplay.txt
  undefined_syms_auto_path: linkers/USA/undefined_syms_auto.gameplay.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # The overlay loader copies the stored BSS zeros; it does not clear them.
  ld_bss_is_noload: False
  # Recovered data belongs to code-bearing C translation units.
  # Explicit ownership preserves the interleaved section layout.
  auto_link_sections: []
  # File ends at an unaligned size (0x81F69); do not pad sections to align.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

