# @@TITLE@@
# GENERATED by tools/gen_overlay_configs.py from configs/USA/overlays.toml.
# Do not edit this file - edit the manifest or configs/USA/overlay.template.yaml.
# Source: @@TARGET@@
# Load address: @@VRAM@@  size: @@SIZE_HEX@@ (@@SIZE@@)
name: "@@TITLE@@"
sha1: @@SHA1@@
options:
  basename: @@NAME@@
  target_path: @@TARGET@@
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  # *bin subsegments write the bytes the build .incbin's back here. A build
  # input, regenerated by every split - gitignored, never committed.
  asset_path: assets/USA/incbin

  asm_path: asm/USA/@@FAMILY@@
  src_path: src/@@FAMILY@@
  build_path: build/USA
  hasm_in_src_path: True

  ld_script_path: linkers/USA/@@NAME@@.ld

  # Flat pe2pkg overlay: no PS-X EXE header. Layout is
  #   header/rodata → .text → trailing data (models, animation banks)
  # so section_order must keep .rodata before .text before .data.
  migrate_rodata_to_functions: True
  find_file_boundaries: False
  pair_rodata_to_text: False

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  # Every overlay in a family loads at the same address, so a bare `func_<vram>`
  # would name one function per overlay. Prefixing with the segment name keeps
  # generated names globally unique, which the decomp tooling relies on
  # (decomp_overlay.py find, tools/claude, score_functions.py, the vacuum).
  symbol_name_format: $SEG_$VRAM

  # Imports resolve out of main and gameplay, which are contiguous below this
  # slot and both resident whenever this overlay is.
  global_vram_start: @@GLOBAL_VRAM_START@@
  global_vram_end: @@GLOBAL_VRAM_END@@

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  symbol_addrs_path:
    - configs/USA/sym/@@FAMILY@@/@@NAME@@.txt
    - @@IMPORTS@@
  reloc_addrs_path: @@RELOCS@@

  undefined_funcs_auto_path: linkers/USA/undefined_funcs_auto.@@NAME@@.txt
  undefined_syms_auto_path: linkers/USA/undefined_syms_auto.@@NAME@@.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True
  # Package sizes are not word-aligned; do not pad sections to align.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

segments:
  - name: @@NAME@@
    type: code
    start: 0x0
    vram: @@VRAM@@
    align: 4
    subalign: 4
    subsegments:
@@SUBSEGMENTS@@
  - [@@SIZE_HEX@@]
