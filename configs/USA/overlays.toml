[actors]
description = "Actor / enemy overlay"
# One actor is issued as up to three packages, one per RAM slot, and the slot-2
# and slot-3 packages are the slot-1 package relocated - every differing word is
# a pointer, a j/jal target, a %hi/%lo half, or word 0 (the package id). They are
# one family, not three, so a relocated copy can share the original's source out
# of src/actors/lib/; the slot is a per-overlay `load_addr`.
load_addr   = 0x80131E20
global_vram_start = 0x80010000
global_vram_end   = 0x80131E20
imports = "configs/USA/sym/actors.imports.txt"

[actors.overlays]
actor_100300 = { rodata = [{ start = "0x54", unit = "actor_100300_text" }], shared = [{ start = "0x78", end = "0x54B4", unit = "actor_100300_text" }] }
actor_100400 = { shared = [{ start = "0x1AC", end = "0xAB0C", unit = "actor_100400_text" }], rodata = [{ start = "0x4", unit = "actor_100400_text" }, { start = "0x2C", unit = "actor_100400_header_2" }] }
actor_100500 = { note = "empty actor slot; the id resolves, the package has no code" }
actor_100700 = { rodata = [{ start = "0x3C", unit = "actor_100700_text" }, { start = "0x54", unit = "actor_100700_header_2" }], shared = [{ start = "0x60", end = "0x3670", unit = "actor_100700_text" }] }
actor_101000 = { note = "empty actor slot; the id resolves, the package has no code" }
actor_101100 = { note = "not shared with its other slots: an unpaired %hi/%lo that splat emits as a literal, which bakes one slot address into a shared body", shared = [{ start = "0x736C", end = "0x73A8", unit = "actors_shared_8013918c" }, { start = "0x73A8", end = "0x73DC", unit = "actors_shared_801511c8" }] }
