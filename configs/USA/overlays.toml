[rooms]
description = "Room overlay"
load_addr   = 0x8017D5C0
global_vram_start = 0x80010000
global_vram_end   = 0x8017D5C0
imports = "configs/USA/sym/rooms.imports.txt"

# One package per room folder in STAGE1-5, named for the stage and the game's
# own room number (folder `<n>01` is room n). These are addresses, not
# descriptions: the display names live in the map-UI overlays (`map_akropolis`
# and friends hold the pools - Square, Cafeteria, Gas station, Motel room 1),
# but there is no one-to-one mapping - several rooms share a display name and
# some have none - so matching a room to its name needs the map plus the room's
