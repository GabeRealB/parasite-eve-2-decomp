# Parasite Energy effects, at the map-picture address, so the two are mutually
# exclusive - you are not looking at the map while casting.
#
# What they are was read off the item table. `Gp_ItemDescs` carries the twelve PE
# spells at items 15-50, each as three consecutive entries (the three levels), in
# exactly the order of the twelve packages here. The file ids match that stride:
# each package is loaded by three consecutive `501xx` ids, one per level, and the
# three differ only in the SPK sound bank they pair with - so the code is shared
# by the levels and only the sound is per-level.
#
# The call profiles agree: the offensive spells drive `Gp_SpawnEff` and
# `Task_Reparent`, while the support ones (metabolism, healing, antibody) draw
# rings and arcs around Aya and nothing else. No package holds a TMD or a
# texture; they are pure effect code.
[pe]
description = "Parasite Energy effect"
load_addr   = 0x8012EF30
global_vram_start = 0x80010000
global_vram_end   = 0x8012EF30
imports = "configs/USA/sym/pe.imports.txt"

[pe.overlays]
pyrokinesis = { pe_level_ids = "50101-50103", rodata_head = "0x4", shared = [{ start = "0x1E90", end = "0x2288", unit = "pe_shared_8012fb14" }] }
combustion = { pe_level_ids = "50104-50106", shared = [{ start = "0xBE4", end = "0xFDC", unit = "pe_shared_8012fb14" }] }
inferno = { pe_level_ids = "50107-50109", rodata_head = "0x4" }
necrosis = { pe_level_ids = "50110-50112" }
plasma = { pe_level_ids = "50113-50115" }
apobiosis = { pe_level_ids = "50116-50118", rodata_head = "0x4" }
metabolism = { pe_level_ids = "50119-50121" }
healing = { pe_level_ids = "50122-50124", shared = [{ start = "0x564", end = "0x6B4", unit = "pe_shared_8012f9a8" }] }
lifedrain = { pe_level_ids = "50125-50127", rodata_head = "0x4", shared = [{ start = "0xA78", end = "0xBC8", unit = "pe_shared_8012f9a8" }, { start = "0x1690", end = "0x1990", unit = "pe_shared_801305c0" }] }
antibody = { pe_level_ids = "50128-50130", shared = [{ start = "0x19A4", end = "0x1CA4", unit = "pe_shared_801305c0" }] }
energyshot = { pe_level_ids = "50131-50133", shared = [{ start = "0x820", end = "0xB20", unit = "pe_shared_801305c0" }] }
energyball = { pe_level_ids = "50134-50136" }

# The tail sits at the same stride-3 spacing (slots 15, 16, 17 of the same
# enumeration), which lines up with the three items after the four passive
# "Attach this and see what happens" ornaments. Only two of those - Flare and
# Pepper Spray - are "Use to ..." items, so the third package is one more than
# the usable items account for, and the assignment below is by position and by
# what the code draws, not proven: 820 bytes of rings and fade quads with no
# motion, a spawned moving object, and a scrolling-texture cloud
# (`Gp_AddTpageShift`) that suits a gas spray.
ofuda        = { pe_slot = 15, ambiguous = true }
flare        = { pe_slot = 16, ambiguous = true }
pepper_spray = { pe_slot = 17, ambiguous = true }
