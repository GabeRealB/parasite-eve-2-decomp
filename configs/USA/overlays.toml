# Proposed overlay manifest -- PROPOSAL, not yet applied.
#
# One entry per logical overlay, replacing the per-section keys with one
# ordered list of the objects the image contains. Built from the generated
# splat configs; regenerate with local/propose_overlays.py.
#
# An entry names one package, and declares its id:
#
#   [<family>.overlays.<name>]
#   id = <word 0>
#
# except where a family loads the same package into several slots at different
# addresses. There the entry covers them all, and states which package each
# slot is and the id it carries:
#
#   slots = [ { slot = 1, package = "...", id = ... }, ... ]
#
# A slot built from a source it shares with other slots (`variant` units) may
# declare `aliases = { definition = "public name" }`. The source defines each
# symbol once, under one name, and every package built from it carries that
# name; the resident images, which refer to several of those packages, need a
# name of its own for each. The build hands the list to the source as
# PACKAGE_ALIASES, a run of DEFINE_ALIAS statements (include/decomp/common.h),
# and the package then exports the definition under both names.
#
# Both are declared rather than derived. A package name is an identification,
# and packages are named in the extractor, so computing one from a pattern
# would hard-code a naming convention the project means to retire. An id is
# compiled in, reaching the build as that overlay's PKG_ID, so reading it back
# out of the package it is checked against would leave those bytes unverified:
# a derived id cannot be wrong, which is not the same as being right.
#
# Derived, because they follow from a declared decision or merely describe the
# input: the load address, from the slot through the family's slot map; and
# sha1, size and the .text span, from the package, as today.
#
# `objects` is every object in the image, in address order of its first
# subsegment, which is the order splat lists them in the linker script:
#
#   { unit = "...", rodata = "...", text = "...", data = "..." }
#       a translation unit, giving the offset it begins at in each section it
#       owns. Rodata and data reached from a unit are keys on it, because its
#       source includes them; there is no separate rodata object. `tail = true`
#       on the last unit says its data runs to the image's last byte, where a
#       package ends part-way through a word; without it the generator covers
#       that partial word with a segment of its own.
#       `bss` places a unit's uninitialized globals in a stored zero run, at
#       an eight-byte boundary. These bytes remain in the loaded image: the
#       overlay loader does not clear BSS separately.
#       A terminal runtime allocation may instead declare bss and bss_size.
#       Its verified zero prefix is serialized to the original package size;
#       the full allocation remains in C BSS, including any unstored tail.
#
#   { kind = "data", at = "..." }    a data run nothing has claimed
#   { kind = "model", at = "..." }   a model's arrays and display list
#   { kind = "modelSource", at = "..." }
#       the model's `TmdSource` record, which follows its model. Task
#       descriptors point at the record, so it is an object of its own and
#       takes its name from the overlay's symbols; the model before it is the
#       asset. The generator checks each record against the package.
#       `in_c = true` retains this declaration and validation when the record
#       is defined in a code unit's data; it emits no assembly data segment.
#   { kind = "animation", at = "...", sets = ["...", ...] }
#       consecutive exported animation sets, with descriptor offsets listed
#       explicitly. Pose, keyframe and track-index bounds are checked before
#       the generator emits the resource as binary data.
#   { kind = "collision", at = "..." }   a room's collision grid: its normals,
#       vertices, faces and per-cell face lists - geometry, so an asset
#   { kind = "collisionSource", at = "..." }
#       the grid's header (`WorldCollisionGrid`), which points at those arrays and
#       gives the grid's size; the room's records name it
#       `in_c = true` on both means a code unit declares the arrays and header;
#       the arrays' initializers are generated (tools/gen_collision_inc.py).
#   { kind = "collisionPatch", at = "...", pieces = ["vectors N", "faces N", ...] }
#       headerless collision geometry that code copies into a live grid (a
#       moving part); each piece is one array, of SVECTORs or WorldCollisionGridFaces
#       all assembly, named from the offset given, so inserting a neighbour
#       never renames them -- the defect the old ordinal names carried.
#
#   { kind = "packageId" }           the first word of the image
#       Every image opens with its package id, so this object is first in every
#       list and carries no offset. It is stated rather than implied: an implied
#       run has no end of its own, so it grows to wherever the next object
#       starts, and content that happened to follow the id -- a dispatch table
#       in some images -- was swallowed by it and could never be given a source.
#       Stating it makes the id four bytes everywhere and leaves whatever
#       follows to be owned like anything else. This is also what makes the old
#       `rodata_head` key unnecessary.
#
# Unit paths are family-relative: `lib/...` for a body shared between different
# overlays, `<name>/...` for one belonging to this overlay alone -- or, for a
# slotted entry, shared only between its own slots.


