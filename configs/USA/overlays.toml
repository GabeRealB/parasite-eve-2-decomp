# Overlay families that are generated rather than hand-written.
#
# main / gameplay / title stay as hand-maintained yaml: each has quirks (rodata
# ordering fixes, hasm segments, a PS-X EXE header) that a template cannot
# express. Everything else is near-identical boilerplate over a flat .pe2pkg,
# so it is generated by tools/gen_overlay_configs.py into configs/USA/generated/.
#
# Only human decisions live here. Size, sha1 and the .text span are derived
# from the package itself, so they cannot drift out of sync with the data.
# Set `text` explicitly on an overlay to override the derived span.
#
# The leading rodata is one subsegment owned by the first code unit. When a
# later unit owns part of it - as it does the moment one of that unit's
# functions is decompiled and the compiler emits its own jump tables - cut it
# with `rodata = [{ start = "<offset>", unit = "<unit>" }]`. A unit's `.rodata`
# appears once in the linker script, at the offset its subsegment names, so the
# cut is what puts the compiler-generated table at the right address.
#
# A `rodata` cut pairs with a `.text` cut, so it cannot give a table to the
# overlay's *first* function - there is no text ahead of it to cut at. Use
# `rodata_head = "<offset>"` instead: the `0x0..<offset>` header stays in
# assembly as its own `<name>_hdr` object and the first code unit's `.rodata`
# starts at `<offset>`, which is where its table has to land.
#
# A `rodata` cut whose `unit` matches a `shared` span is emitted as
# `lib/<unit>`, pairing the compiler-generated jump table with the shared
# C object rather than an overlay-local unit.
#
# The trailing data - models, animation banks, clip tables - stays as split
# assembly. `data = [{ start = "<offset>", unit = "<unit>" }, ...]` hands one
# run of it to a C unit, for the few symbols the decompiled code references:
# muzzle offset vectors at the head of the region, the zeroed work arrays at
# the end of a package. An entry with no `unit` hands the rest back to
# assembly. splat lists an object in the linker script at its *first*
# subsegment, so a run at the end of a package needs a unit of its own -
# `<name>_work` by convention - rather than the overlay's first one.
#
# `duplicate_of = "<file id>"` marks an overlay whose package is byte-identical
# to another's. It gets no config and is never split: splitting it a second time
# would produce a second copy of the same disassembly and the same functions
# under a second symbol prefix. Its build output is copied from the primary, so
# it is still checksummed against the real file. The generator re-checks the
# byte-identity every run and fails if it ever stops holding.

[weapons]
description = "Equipped-weapon overlay"
load_addr   = 0x8011D1C0
# Imports resolve out of main (0x80010000..) and gameplay (0x80093800..),
# which are contiguous and both resident whenever a weapon overlay is.
global_vram_start = 0x80010000
global_vram_end   = 0x8011D1C0
imports = "configs/USA/sym/weapons.imports.txt"

# Named after the weapon each overlay is the equipped model for.
# `Gp_EnqueueItemPreviewCd` (src/gameplay/3688.c) maps item id 0x80..0x9F to
# file id 10300 + (id - 0x7F), so package 10301+n is item 0x80+n.
#
# Six descriptors in that range are fully zeroed - unused weapon slots. Five of
# them (0x86, 0x87, 0x89, 0x91, 0x97) share one placeholder animation block and
# are byte-identical in size; 0x85 has its own block but is equally nameless.
# None of the six contains a single function.
[weapons.overlays]
as12 = { item = 0x8E, weapon = "AS12", rodata_head = "0x4" }
grenade_pistol = { item = 0x8A, weapon = "Grenade Pistol", rodata = [{ start = "0x4", unit = "grenade_pistol_3" }], shared = [{ start = "0x1E0", end = "0x53C", unit = "weapons_shared_8011d3a0" }, { start = "0x9A0", end = "0x9CC", unit = "weapons_shared_8011ddf8" }, { start = "0x9CC", end = "0xA10", unit = "weapons_shared_8011de24" }], data = [{ start = "0xA74" }, { start = "0xE260", unit = "grenade_pistol_work" }, { start = "0xE27C" }] }
