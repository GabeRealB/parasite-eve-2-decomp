<title>PE2 Asset Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a navigator on the left (the overlay tree, or assets by type), one subject on the right built from stacked sections. */
:root {
  --bg: #eef1f2; --panel: #f8fafa; --ink: #16242b; --muted: #5b6d75; --line: #c9d3d6; --grid: #dde4e6;
  --accent: #0b6b7a; --accent-soft: #d5e8ea; --clash: #b3402a; --clut: #7a5a0b;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10181c; --panel: #162126; --ink: #dfe8ea; --muted: #8fa3aa; --line: #2c3c43; --grid: #1f2d33;
  --accent: #56c0cf; --accent-soft: #173940; --clash: #f08a6e; --clut: #e0bd62; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10181c; --panel: #162126; --ink: #dfe8ea; --muted: #8fa3aa; --line: #2c3c43; --grid: #1f2d33;
  --accent: #56c0cf; --accent-soft: #173940; --clash: #f08a6e; --clut: #e0bd62; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.app { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); height: 100%; }
@media (max-width: 800px) { .app { grid-template-columns: minmax(0, 1fr); height: auto; } .nav { max-height: 45vh; } }
.nav { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
.nav header { padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; font-weight: 600; margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel); border: 0; padding: 5px 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button small { display: block; font: 10px var(--mono); letter-spacing: 0; text-transform: none; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
input, select { font: 13px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; min-width: 0; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.list { overflow: auto; padding: 6px 0 16px; flex: 1; min-height: 0; font: 12px var(--mono); }
.list a, .list summary { display: block; padding: 2px 16px; color: var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list a:hover, .list summary:hover { background: var(--grid); }
.list a.cur { background: var(--accent-soft); }
.list details > div { padding-left: 12px; border-left: 1px solid var(--grid); margin-left: 16px; }
.list details > div a, .list details > div summary { padding-left: 6px; }
.badge { color: var(--clash); font-weight: 500; } .note { margin-top: 6px; max-width: 80ch; } .rename { font: inherit; width: 26ch; max-width: 100%; padding: 1px 4px; color: var(--ink); background: transparent; border: 1px solid var(--muted); border-radius: 3px; } textarea.mono { width: 100%; max-width: 100ch; font-family: ui-monospace, monospace; color: var(--ink); background: transparent; } .dim { color: var(--muted); }
main { overflow: auto; min-width: 0; }
.subject { padding-inline: 20px; padding-block: 16px 48px; display: flex; flex-direction: column; gap: 22px; max-width: 1400px; }
.subject > header h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; font-family: var(--mono); overflow-wrap: anywhere; }
.crumbs { font: 12px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; }
a.lnk { color: var(--accent); text-decoration: none; cursor: pointer; } a.lnk:hover { text-decoration: underline; }

section > p { color: var(--muted); font-size: 12px; margin: 0 0 8px; max-width: 80ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(256px * var(--scale, 2))), 1fr)); gap: 14px; }
label.row { flex-direction: row; align-items: center; gap: 8px; }
.tile { display: flex; flex-direction: column; gap: 4px; min-width: 0; font: 11px var(--mono); }
.tile canvas, .shot canvas, .shot img { image-rendering: pixelated; border: 1px solid var(--line); max-width: 100%; background: repeating-conic-gradient(var(--grid) 0 25%, var(--bg) 0 50%) 0 0 / 16px 16px; }
.tile canvas { max-width: none; } .tile { overflow-x: auto; }
.shot { overflow-x: auto; } .shot canvas, .shot img { max-width: none; }
.tile.miss canvas { border-color: var(--clash); border-width: 2px; }
.tile div { overflow-wrap: anywhere; } .tile .what { color: var(--muted); } .flag { color: var(--clash); font-weight: 500; }

th { text-align: left; font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); }
td { padding: 3px 14px 3px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
pre.mono { font: 12px var(--mono); margin: 0; overflow-x: auto; }
.scrollx { overflow-x: auto; } table.wide td { white-space: normal; min-width: 90px; max-width: 360px; overflow-wrap: anywhere; }
button { font: 12px var(--sans); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 3px; padding: 3px 10px; margin-top: 6px; cursor: pointer; }
.seg button { margin-top: 0; }
video { max-width: 100%; border: 1px solid var(--line); background: #000; }
ul.plain { margin: 0; padding-left: 18px; font: 12px var(--mono); } ul.plain li { margin: 2px 0; overflow-wrap: anywhere; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; margin-bottom: 10px; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sheet { position: relative; border: 1px solid var(--line); background: var(--bg); }
.sheet canvas { display: block; image-rendering: pixelated; } .sheetbox { overflow-x: auto; } .sheet { width: max-content; }
.sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sheet .reg { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; } .sheet text { font: 9px var(--sans); fill: var(--muted); }
.ev { font: 12px var(--mono); border: 1px solid var(--line); background: var(--panel); } .ev > div { padding: 1px 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ev .cur { background: var(--accent-soft); }
.ev .k-dim, .ev .k-raw { color: var(--muted); } .ev .k-mark { font-weight: 600; } .ev .k-load { color: var(--accent); } .ev .k-sound { color: var(--clut); } .ev .k-room { font-weight: 600; color: var(--accent); } .ev .k-view { font-weight: 600; }

.jumps { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; align-items: center; margin-top: 8px; } .jumps button { margin-top: 0; min-width: 76px; } button:disabled { color: var(--muted); cursor: default; opacity: .6; } .jumps .to { font-size: 12px; overflow-wrap: anywhere; }
@media (max-width: 560px) { .jumps { grid-template-columns: minmax(0, 1fr); } .jumps .to { margin-bottom: 6px; } }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--panel); }
.sheet .live { fill: none; stroke: var(--accent); vector-effect: non-scaling-stroke; } .sheet .movie { fill: none; stroke: var(--clash); stroke-dasharray: 6 3; vector-effect: non-scaling-stroke; } .sheet text { paint-order: stroke; stroke: var(--bg); stroke-width: 2px; }
audio { height: 28px; max-width: 100%; } iframe { width: 100%; height: 320px; border: 1px solid var(--line); background: var(--panel); }

<div class="app">
  <nav class="nav">
    <header>
      <h1>PE2 Asset Map</h1>
      <span class="seg"><button id="nav-o" aria-pressed="true">Overlays</button><button id="nav-a" aria-pressed="false">Assets</button><button id="nav-f" aria-pressed="false">Files</button><button id="nav-n" aria-pressed="false">Names</button><button id="nav-g" aria-pressed="false">Groups</button><button id="nav-t" aria-pressed="false">Traces</button></span><datalist id="grouplist"></datalist>

      <input id="filter" placeholder="filter by name or what it is; ? = name in question" autocomplete="off" spellcheck="false" aria-label="Filter the list">
    </header>
    <div class="list" id="list"></div>
  </nav>
  <main><div class="subject" id="subject"></div></main>
</div>
