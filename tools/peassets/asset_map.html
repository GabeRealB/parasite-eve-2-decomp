<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

    sections.push(sec(`Played through (${b.tables.length})`, "The package's tables of set pointers that index this bank: a clip constant is an index into one of these. A dash is an empty slot; \"other\" is a set of another bank.", b.tables.map(([tname, entries]) => h("p", {}, h("b", { text: tname + ": " }), entries.map((e, i) => `${i}→${e === -1 ? "–" : e === -2 ? "other" : "set " + e}`).join("  ")))));
  } else if (D.track[key] !== undefined) { await needSide(key); if (mine !== turn) return; sections.push(sec("Samples", "", h("div", { class: "shots" }, renderTrack(key)))); }
  const rows = Object.entries(attrs).filter(([k]) => k !== "notes");
  sections.push(sec("Properties", attrs.notes || "", rows.length ? h("table", {}, rows.map(([k, v]) => h("tr", {}, h("th", { text: k }), h("td", {}, k === "parent" ? [].concat(v).map((p, i) => [i ? ", " : "", link("o", p)]) : k === "vram" ? "0x" + v.toString(16) : String(JSON.stringify(v)).replace(/^"|"$/g, ""))))) : h("p", { text: "None recorded." })));
  const loaders = files.flatMap(f => (loadersOf.get(f) || []).map(l => [f, ...l]));
  sections.push(sec(`In files (${files.length})`, "", files.length ? h("ul", { class: "plain" }, files.map(f => h("li", {}, fileLink(f)))) : h("p", { text: attrs.source ? "Not a chunk of a disc file: it sits inside the package." : "Not placed in any file." })));
  const byRow = l => h("tr", {}, h("td", {}, link("o", l[1])), h("td", { text: D.layers[l[2]] }), h("td", { text: l[3] || "always" }), h("td", { text: D.files[l[0]] }), h("td", { text: l[4] || l[5] ? sign(l[4], l[5]) : "" }));
  const byTable = part => h("div", { class: "scrollx" }, h("table", {}, h("tr", {}, ["Overlay", "Layer", "When", "File", "Offset"].map(t => h("th", { text: t }))), part.map(byRow)));
  sections.push(sec(`Loaded by (${loaders.length})`, "The loads that bring one of those files in.", loaders.length ? capped(loaders, 80, byTable) : null));
  box.replaceChildren(head, ...sections);
}

// ---- routing ----
function route() {
  const hash = location.hash.slice(1), dot = hash.indexOf("."), kind = hash.slice(0, dot), name = hash.slice(dot + 1);
  current = hash; if (kind === "a") { showAsset(name); } else { current = "o." + (D.overlays[name] ? name : "gameplay"); showOverlay(D.overlays[name] ? name : "gameplay"); }
  markNav(); const m = document.querySelector("main"); if (m && m.scrollTo) m.scrollTo(0, 0);
}
$("nav-o").addEventListener("click", () => { navMode = "o"; drawNav(); }); $("nav-a").addEventListener("click", () => { navMode = "a"; drawNav(); });
$("filter").addEventListener("input", drawNav); window.addEventListener("hashchange", route); drawNav(); route();
</script>
