# What tools/gametrace/gametrace.py records. One line of the log per event hit.
#
#   id       a number of your choosing; it is what the patch stub writes into the ring
#   name     what the log calls the event
#   address  the function's entry (addresses do not move when a symbol is renamed; `check` prints the current name)
#   patch    false: a breakpoint - nothing is written into the game, one round trip per hit
#            true:  the entry is redirected to a stub at blob.address that records the registers
# For a breakpoint event only, read by the tool at the stop:
#   ret = true        also v0 when the function returns
#   stack = N         N words of stack arguments (the fifth argument onward)
#   mem = ["a0:16"]   bytes at a register
# For a patch event at an address outside the executable and gameplay, give its own first two instructions:
#   words = [0x27BDFFE8, 0xAFBF0010]

# Where the tool sets everything up. Start the game paused, then the tool: it continues the game to the first of
# these addresses and only there writes the blob, the patches and the breakpoints - by then memory is initialised.
# Each later hit applies the patches again (for a function in an image that is loaded later). Leave it out to set
# up at once, in the game as it stands.
install_at = [0x80014300]     # main

# The GDB server to connect to; --host and --port on the command line override these.
[gdb]
host = "127.0.0.1"
port = 2345

# Only used when some event has patch = true; with none, nothing is written into the game at all.
[blob]
address = 0x80200000     # where the patch stubs and the ring live: memory the game leaves alone (here, just above 2 MB)
records = 1024           # ring size, a power of two. The ring is read at every breakpoint event, and when it fills

[[event]]
id = 1
name = "file_load"
address = 0x8002265C     # fsLoadFile
patch = false

[[event]]
id = 2
name = "sound_request"
address = 0x8005414C     # sndEvtRequestScriptStart
patch = false
ret = true

[[event]]
id = 3
name = "sound_bank_find"
address = 0x8004D150     # sndBankFind
patch = true

[[event]]
id = 4
name = "variant_set"
address = 0x800B5B30     # areaSetPlacementVariant
patch = false
mem = ["a0:8"]

[[event]]
id = 5
name = "caption_command"
address = 0x800E34D8     # capRunCommand
patch = false
