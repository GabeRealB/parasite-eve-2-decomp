# What tools/gametrace/gametrace.py records. Every event is a function, watched by a hook written into the
# running game: nothing stops when it happens.
#
#   id            a number of your choosing, 1..65535; it is what the hook writes in front of its record
#   name          what the log calls the event
#   address       the function's entry (addresses do not move when a symbol is renamed; `check` prints the name)
#   capture       what to record at the entry; default ["a0", "a1", "a2", "a3", "ra"]. Each item is
#                   "a0"             a register
#                   "a0:16"          16 bytes at the address the register holds ("sp+16:4": with an offset)
#                   "0x800714C4:8"   8 bytes at a fixed address
#   exits         offsets of the function's `jr $ra` instructions, to record its returns as well.
#                 `check` lists the ones it finds, ready to paste.
#   exit_capture  what to record at a return; default ["v0"]
#   image         the package holding the function, when it is in neither the executable nor gameplay
#   drain         true: the buffer is read each time this event is over (at its returns if `exits` is given,
#                 otherwise right after its entry). Give it to something rare, such as a file load; without any,
#                 the log is only written when the buffer fills or the tracer detaches.
#   render        the name of a renderer (see [renderer]) that writes this event instead of the raw captures

# Where the tool sets everything up. Start the game paused, then the tool: it continues the game to the first of
# these addresses and only there writes the blob and the hooks - by then memory is initialised. Each later hit
# applies the hooks again (for a function in an image that is loaded later). Leave it out to set up at once.
install_at = [0x80014300]     # main

# The GDB server to connect to; --host and --port on the command line override these.
[gdb]
host = "127.0.0.1"
port = 2345

# Python files that register renderers (`@renderer("name")`); paths are beside this file or from the repository root.
[renderer]
files = ["renderers/pe2.py"]

[blob]
address = 0x80200000     # where the stubs and the buffer live: memory the game leaves alone (here, just above 2 MB)
bytes = 0x100000         # the buffer. The game stops only when it is full, for as long as reading it takes

[[event]]
id = 1
name = "file_load"
address = 0x8002265C     # fsLoadFile(key, mode, page offset, row offset)
capture = ["a0:4", "a1", "a2", "a3", "ra"]
drain = true             # a load pauses the game anyway: the log is brought up to date at each one
render = "file_load"

[[event]]
id = 2
name = "sound_request"
address = 0x8005414C     # sndEvtRequestScriptStart(id, pan, depth)
capture = ["a0", "a1", "a2", "ra"]
exits = [0x17C]          # its one return: v0 is the id when the request was taken
render = "sound_request"

[[event]]
id = 3
name = "sound_bank_find"
address = 0x8004D150     # sndBankFind(bankId)
capture = ["a0", "ra"]

[[event]]
id = 4
name = "variant_set"
address = 0x800B5B30     # areaSetPlacementVariant(key, variant, resetMode)
capture = ["a0:8", "a1", "a2", "ra"]
render = "variant_set"

[[event]]
id = 5
name = "caption_command"
address = 0x800E34D8     # capRunCommand(command)
capture = ["a0", "ra"]
