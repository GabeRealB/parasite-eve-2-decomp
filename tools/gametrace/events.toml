# What tools/gametrace/gametrace.py records. Every event is a function, watched by a hook written into the
# running game: nothing stops when it happens.
#
#   id            a number of your choosing, 1..65535; it is what the hook writes in front of its record
#   name          what the log calls the event
#   address       the function's entry (addresses do not move when a symbol is renamed; `check` prints the name)
#   capture       what to record at the entry; default ["a0", "a1", "a2", "a3", "ra"]. Each item is
#                   "a0"             a register
#                   "a0:16"          16 bytes at the address the register holds ("sp+16:4": with an offset)
#                   "0x800714C4:8"   8 bytes at a fixed address
#   exits         offsets of the function's `jr $ra` instructions, to record its returns as well.
#                 `check` lists the ones it finds, ready to paste.
#   exit_capture  what to record at a return; default ["v0"]
#   image         the package holding the function, when it is in neither the executable nor gameplay. An event
#                 outside the executable is hooked when a handler calls trace.resident(image), not before.
#   drain         true: the buffer is read each time this event is over (at its returns if `exits` is given,
#                 otherwise right after its entry). Give it to something rare, such as a file load; without any,
#                 the log is only written when the buffer fills or the tracer detaches.
#   render        the name of a renderer (see [hooks]) that writes this event instead of the raw captures
#   handler       the name of a handler (same files): a function run at the end of this event's hook with the game
#                 stopped. It is how the tracer learns that an image has been loaded - see "file_loaded" below.

# Where the tool sets everything up. Start the game paused, then the tool: it continues the game to the first of
# these addresses and only there writes the blob and the executable's hooks - by then memory is initialised.
# Leave it out to set up at once.
install_at = [0x80014300]     # main

# The GDB server to connect to; --host and --port on the command line override these.
[gdb]
host = "127.0.0.1"
port = 2345

# Python files with the functions events name: renderers (`@renderer("name")`, how an event is written) and
# handlers (`@handler("name")`, what is done when it happens). Paths are beside this file or from the repository root.
[hooks]
files = ["hooks/pe2.py"]

# The console's memory as the emulator shares it with other programs, where it does (DuckStation: "Export Shared
# Memory", a mapping called duckstation_<pid>). "auto" looks for one; a name picks one; false reads everything
# through the GDB server. It only works when this tool runs on the machine the emulator runs on.
[memory]
shared = "auto"

[blob]
address = 0x80200000     # where the stubs and the buffer live: memory the game leaves alone (here, just above 2 MB)
bytes = 0x100000         # the buffer. The game stops only when it is full, for as long as reading it takes
# Words every stub writes before it touches the blob's memory. This game calls SetMem(2) at start, which sets the
# console's memory-size register (0x1F801060) to a 2 MB window and makes any read above it fault; 0xB88 is the
# value the console starts with, the whole 8 MB window.
poke = [[0x1F801060, 0x00000B88]]

# ---- files

[[event]]
id = 1
name = "file_load"
address = 0x8002265C     # fsLoadFile(key, mode, page offset, row offset)
capture = ["a0:4", "a1", "a2", "a3", "ra"]
drain = true             # a load pauses the game anyway: the log is brought up to date at each one
render = "file_load"

[[event]]
id = 25
name = "file_loaded"
address = 0x8001C53C     # in _cdCmdHandleFileLoad, where a finished load is taken off the queue: every chunk of the file is in memory
capture = []
handler = "file_loaded"  # tells the tracer which image that makes resident, so its hooks can be written
render = "file_loaded"

[[event]]
id = 6
name = "cd_command"
address = 0x8001D2B0     # cdCmdEnqueue(command, fileKey, commandArgs)
capture = ["a0", "a1:4", "a2", "ra"]

# ---- where the player is

[[event]]
id = 4
name = "variant_set"
address = 0x800B5B30     # areaSetPlacementVariant(key, variant, resetMode)
capture = ["a0:8", "a1", "a2", "ra"]
render = "variant_set"

[[event]]
id = 7
name = "view_load"
address = 0x800A9010     # loadingBeginViewLoadTask(task): the live location (view, room, area, stage, warp, variant) says which
capture = ["0x800714C4:8", "ra"]
render = "location"

[[event]]
id = 8
name = "flag_nibble"
address = 0x8004AC58     # gameFlagSetNibble(flagId, value): story flags and the companion schedule
capture = ["a0", "a1", "ra"]

[[event]]
id = 9
name = "flag_byte"
address = 0x800E3FAC     # gameFlagSetPackedByte(nibbleIndex, packedValue)
capture = ["a0", "a1", "ra"]

[[event]]
id = 10
name = "companion_select"
address = 0x800ABA4C     # companionSelectForArea(): v0 is the companion family, 0 for none
capture = ["0x800714C4:8", "ra"]
exits = [0x274]
render = "location"

# ---- sound

[[event]]
id = 2
name = "sound_request"
address = 0x8005414C     # sndEvtRequestScriptStart(id, pan, depth)
capture = ["a0", "a1", "a2", "ra"]
exits = [0x17C]          # its one return: v0 is the id when the request was taken
render = "sound_request"

[[event]]
id = 11
name = "sound_stop"
address = 0x800542D0     # sndEvtRequestScriptStop(selector, stopControl)
capture = ["a0", "a1", "ra"]
render = "sound"

[[event]]
id = 12
name = "stage_sound_request"
address = 0x800E3DD8     # sndEvtRequestStageScriptStart(id, pan, attenuation)
capture = ["a0", "a1", "a2", "ra"]
render = "sound"

[[event]]
id = 13
name = "music_start"
exits = [0x68]           # v0: whether the sequence was started
address = 0x800512BC     # sndEvtRequestMidiStart(sequenceId, fadeTicks)
capture = ["a0", "a1", "ra"]

[[event]]
id = 14
name = "sound_reset_for_area"
address = 0x800537FC     # sndScriptResetForArea(stage, area): which banks survive a room change is decided here
capture = ["a0", "a1", "ra"]

[[event]]
id = 15
name = "sound_bank_load"
address = 0x8004CE28     # sndBankAllocTables(payload): the payload's header names the bank; v0 is the descriptor, or 0
capture = ["a0:20", "ra"]
exits = [0x198]
render = "sound_bank_load"

[[event]]
id = 16
name = "sound_bank_free"
address = 0x8004D0F0     # sndBankFree(bank)
capture = ["a0:16", "ra"]
render = "sound_bank_free"

[[event]]
id = 3
name = "sound_bank_find"
address = 0x8004D150     # sndBankFind(bankId): a note that names another bank
capture = ["a0", "ra"]

# ---- captions

[[event]]
id = 5
name = "caption_command"
address = 0x800E34D8     # capRunCommand(command)
capture = ["a0", "ra"]

[[event]]
id = 17
name = "caption_command_transition"
address = 0x800E3B60     # capRunCommandWithTransition(command)
capture = ["a0", "ra"]

[[event]]
id = 18
name = "caption_file"
address = 0x800E6D60     # capSelectLoadedFile(dataResourceOrdinal)
capture = ["a0", "ra"]

[[event]]
id = 19
name = "caption_sequence"
address = 0x800E6C70     # capStartSequenceSlot(commandIndex, playbackMode, variantKey)
capture = ["a0", "a1", "a2", "ra"]

# ---- what goes into video memory

[[event]]
id = 20
name = "image_upload"
address = 0x80017F44     # LoadImage(rect, pixels): the rectangle is x, y, w, h
capture = ["a0:8", "a1", "ra"]
render = "rect"

[[event]]
id = 21
name = "image_move"
address = 0x80018004     # MoveImage(rect, x, y)
capture = ["a0:8", "a1", "a2", "ra"]
render = "rect"

# ---- movies, and messages between tasks

[[event]]
id = 22
name = "stream_scene"
address = 0x800AF89C     # streamSelectScene(group, id, subId, subId2)
capture = ["a0", "a1", "a2", "a3", "ra"]

[[event]]
id = 23
name = "movie_start"
address = 0x8001F180     # streamPrepareMoviePlayback(slotIndex)
capture = ["a0", "ra"]

[[event]]
id = 24
name = "task_message"
address = 0x800AC464     # taskMessageDispatch(receiver, messageId, firstArg, secondArg)
capture = ["a0", "a1", "a2", "a3", "ra"]
