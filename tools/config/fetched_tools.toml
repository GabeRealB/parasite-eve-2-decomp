# What the decomp fetches to build and match with (`tools/config/fetch_tools.py`, `config.py splat fetch-tools`), each by its URL and SHA-256, into
# `local/tools/<name>/` - or `local/tools/<platform>/<name>/` for what is built for one platform (a table a platform,
# `[<name>.<platform>]`). The toolchain is what the editor's pe2.psx downloads, built from source by the editor's
# repository: the same releases, pinned here as there, so that each builds with the same tools and neither needs the
# other.
#
# `strip` names an archive's top folder, unpacked without it; `take` the files taken of one (to where, and with what
# SHA-256 where given); `file` names a download that is the program itself; `patches` are applied in order after
# unpacking.

