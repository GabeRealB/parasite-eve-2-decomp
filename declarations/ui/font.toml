# The buttons where Medium has $ % & *.
characters = { "0x24" = "○", "0x25" = "□", "0x26" = "△", "0x2A" = "✕" }

[small.from.USA]
at = [{ disc = "disk1", slot = "SLUS_010.42" }, { disc = "disk2", slot = "SLUS_010.55" }]
address = 0x800604B0
sha1 = "ba753c05a5b39e019d9d071a1f52290ea0a3c589"

# The page the three UI faces are drawn from, and their tables: each face's rows of the page (its band), which its V bias
# reaches; a band's background index 5, the rows of none 0; a glyph without art (the space) draws the 1 x 1 cell at 0, 0.
[atlas]
uid = "uid://1nqpk8onk6hlb"
template = "font_atlas"
size = [256, 256]
background = 5
gap = 0
blank = [0, 0]
faces = [
    { font = { uid = "uid://1trik7y1sdfg9", path = "res://ui/font/medium.node" }, bias = 38, band = [38, 125] },
    { font = { uid = "uid://cmo8xsrsj0ff", path = "res://ui/font/large.node" }, bias = -128, band = [128, 255] },
    { font = { uid = "uid://hwngnup2vy2m", path = "res://ui/font/small.node" }, bias = 0, band = [0, 32] },
]

[atlas.from.USA]
at = [{ stage = 0, file = 1, slot = "font_image", page = 0 }, { stage = 0, file = 20162, slot = "font_image", page = 0 }]
sha1 = "87360176e6526b05384e424170ef3a119ae3f014"
