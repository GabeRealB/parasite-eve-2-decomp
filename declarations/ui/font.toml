# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

# The UI font's page: the atlas's (below), which the faces make; extraction reads it there.
[texture]
uid = "uid://1lszyuxlyyz77"
template = "font_texture"
atlas = { uid = "uid://1nqpk8onk6hlb", path = "res://ui/font/atlas.node" }
page = { slot = { uid = "uid://1woctxwwnoy2p", path = "res://engine/vram/ui_font.node" }, at = [0, 0] }
mode = "indexed_4bpp"
size = [256, 256]
palettes.fill = { executable = "ui/font/glyph_palettes" }
variants.fill = { palette = "fill" }
variants.translucent_outline = { palette = "fill" }
variants.opaque_outline = { palette = "fill" }

[medium]
uid = "uid://1trik7y1sdfg9"
template = "font"
encoding = { uid = "uid://tmob68t9j6a5", path = "res://ui/encoding/ui.node" }
first = 0x20
count = 224
kerning = 2
family = "Parasite Eve II UI"
style = "Medium"
# From 0x7F on, a character the font lacks draws the space; below it, and 0x81, nothing.
missing = { character = " ", from = 0x7F }
nothing = [0x81]

[medium.from.USA]
at = [{ disc = "disk1", slot = "SLUS_010.42" }, { disc = "disk2", slot = "SLUS_010.55" }]
address = 0x8005EFB0
sha1 = "23a9089e7290ebbe9a9b9127862c8b8b36622f25"

[large]
uid = "uid://cmo8xsrsj0ff"
template = "font"
encoding = { uid = "uid://tmob68t9j6a5", path = "res://ui/encoding/ui.node" }
first = 0x20
count = 224
kerning = 2
family = "Parasite Eve II UI"
style = "Large"
# From 0x7F on, a character the font lacks draws the space; below it, and 0x81, nothing.
missing = { character = " ", from = 0x7F }
nothing = [0x81]

[large.from.USA]
at = [{ disc = "disk1", slot = "SLUS_010.42" }, { disc = "disk2", slot = "SLUS_010.55" }]
address = 0x8005FA30
sha1 = "968713a4c4410e4e1a3148623dda5e10e63ce127"

[small]
uid = "uid://hwngnup2vy2m"
template = "font"
encoding = { uid = "uid://tmob68t9j6a5", path = "res://ui/encoding/ui.node" }
first = 0x20
count = 91
kerning = 1
family = "Parasite Eve II UI"
