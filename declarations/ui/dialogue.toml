[translated]
uid = "uid://19asravi1hpai"
template = "operation"
label = "Translated strings"
ops.table = { op = "input", name = "table" }
ops.translations = { op = "setting", type = "table", default = {}, label = "Translations, by language" }
ops.own = { op = "settings", from = { node = "table" } }
ops.config = { op = "config" }
ops.chosen = { op = "select", field = "properties.language", of = { setting = "translations" }, output = "settings", from = { key = "config" } }
ops.over = { op = "overlay", field = "strings", from = { over = "chosen", under = "own" } }
ops.either = { op = "merge", from = { inputs = ["over", "own"] } }
ops.strings = { op = "output", name = "strings", from = { value = "either" } }

[translated_table]
uid = "uid://1uhdpi2480a1o"
template = "template"
label = "Translated string table"
node_type = "pe2.dialogue@string_table"
makes = [
    { op = "pe2.dialogue@string_table", strings = {} },
    { op = "uid://19asravi1hpai" },
    { op = "output", name = "strings" },
]
