# mode 2 sectors). Which movies and in what order follows from its stages: each stage's files in order - stage 0's by
# id, a stage's folders in its layout's order and their files by id - and each file's streams in order, the movies
# that play from this file (a volume, and this disc where the stage is on both). The file has no bytes of its own:
# extraction holds its movies, joined, to its sha1.

