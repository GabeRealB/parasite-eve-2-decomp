# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[casual]
uid = "uid://3be0alid5dnd"
template = "texture"
page = { slot = { uid = "uid://tifo5i55y0n5", path = "res://engine/vram/character_sheet.node" }, at = [0, 0] }
mode = "indexed_8bpp"
size = [256, 256]
palettes.default = { slot = { uid = "uid://11pipfqna1uxw", path = "res://engine/vram/character_palette.node" }, at = [0, 0] }
palettes.default_2 = { slot = { uid = "uid://11pipfqna1uxw", path = "res://engine/vram/character_palette.node" }, at = [0, 1] }
cells.page_0 = { rect = [0, 0, 128, 256], palette = "default" }
cells.page_1 = { rect = [128, 0, 128, 256], palette = "default_2" }

[casual.import]
importer = "pe2.images@ora"
source = "source.ora"

[casual.from.USA]
