# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[submachine_gun_texture]
uid = "uid://hmpu9164hbgp"
template = "texture"
page = { slot = { uid = "uid://7hpx62tky6nk", path = "res://engine/vram/held_weapon_sheet.node" }, at = [0, 0] }
mode = "indexed_4bpp"
size = [256, 64]
palettes.default = { slot = { uid = "uid://qemb3djlk7f1", path = "res://engine/vram/held_weapon_palette.node" }, at = [0, 0] }

[submachine_gun_texture.import]
