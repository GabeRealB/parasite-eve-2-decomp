# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[texture]
uid = "uid://cpbbcp5we1s4"
kind = "image"
role = "atlas"
page = { slot = { uid = "uid://tifo5i55y0n5", path = "res://engine/vram/character_sheet.asset" }, at = [0, 0] }
mode = "indexed_8bpp"
size = [256, 256]
palettes.default = { slot = { uid = "uid://11pipfqna1uxw", path = "res://engine/vram/character_palette.asset" }, at = [0, 0] }
palettes.default_2 = { slot = { uid = "uid://11pipfqna1uxw", path = "res://engine/vram/character_palette.asset" }, at = [0, 1] }
cells.page_0 = { rect = [0, 0, 128, 256], palette = "default" }
cells.page_1 = { rect = [128, 0, 128, 256], palette = "default_2" }

[texture.import]
importer = "pe2.images@ora"
source = "source.ora"

[texture.from.USA]
at = [{ stage = 0, file = 10200, slot = "image", page = 0 }, { stage = 0, file = 10500, slot = "image", page = 0 }, { stage = 0, file = 10600, slot = "image", page = 0 }]
sha1 = "f917df75fc8b6d9f4417e9f6c96fab7202d15f55"
palettes = { default = "161ab89296b46a476391b8eacb7408c55dde0760", default_2 = "f7896ebac30bb6d7801aec80133f4d9426599fd4" }

