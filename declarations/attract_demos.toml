# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

# The attract demos, in the order the title plays them: each a file of saved state and the room's logo.
[demos]
uid = "uid://6p4qnxbnkvf7"
template = "list"
items = [
    { uid = "uid://j9yxdst1ap8z", path = "res://stage0/companions.node", output = "files/akropolis_square" },
    { uid = "uid://j9yxdst1ap8z", path = "res://stage0/companions.node", output = "files/dryfield_main_street" },
    { uid = "uid://j9yxdst1ap8z", path = "res://stage0/companions.node", output = "files/dryfield_underpass" },
]

[logo]
uid = "uid://tudppllo4muy"
template = "texture"
page = { slot = { uid = "uid://1ndxe29dxqbxv", path = "res://engine/vram/shared_sheets.node" }, at = [64, 0] }
mode = "indexed_8bpp"
size = [128, 64]
palettes.default = { slot = { uid = "uid://wpn0tw2abf5i", path = "res://engine/vram/shared_palettes.node" }, at = [0, 1] }

[logo.import]
importer = "pe2.images@ora"
source = "source.ora"

[logo.from.USA]
at = [{ stage = 0, file = 801000, slot = "logo", page = 0 }, { stage = 0, file = 801100, slot = "logo", page = 0 }, { stage = 0, file = 801200, slot = "logo", page = 0 }, { stage = 0, file = 900000, slot = "logo", page = 0 }, { stage = 0, file = 900001, slot = "logo", page = 0 }, { stage = 0, file = 900002, slot = "logo", page = 0 }, { stage = 0, file = 900003, slot = "logo", page = 0 }]
sha1 = "9773576ae8f973ca2902e4e782b28a740925a25a"
palettes = { default = "9b1bf0cd993dfb8bdfc03951b20b24ae1ba75fd0" }

[logo_shadow]
uid = "uid://owlpds0b4ml8"
template = "texture"
page = { slot = { uid = "uid://1ndxe29dxqbxv", path = "res://engine/vram/shared_sheets.node" }, at = [64, 64] }
mode = "indexed_8bpp"
size = [128, 64]
palettes.default = { slot = { uid = "uid://wpn0tw2abf5i", path = "res://engine/vram/shared_palettes.node" }, at = [0, 0] }

