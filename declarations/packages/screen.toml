# The modules of screen: one library each, so that what includes one depends on it alone.

# Capturing the frame drawn.
[frame_capture]
uid = "uid://y2lqfm1ad1b8"
template = "library"
headers.public = "include"
dependencies = [
    { uid = "uid://1hq6535kv7l92", path = "res://packages/core.node" },
    { uid = "uid://1gge5rcau98eq", path = "res://packages/engine.node" },
]

# Full-screen fades.
[fade]
uid = "uid://1f799t0mreqbq"
