# The player's weapons: each a package loaded into the weapon slot as it is equipped, with its own header, and what
# they share, a library per module.

# What the player's code and every weapon know of weapons: their indices, their sounds' slots, what a launched grenade
# carries.
[weapon]
uid = "uid://8fuooz076vi3"
template = "library"
headers.public = "include"
dependencies = [
    { uid = "uid://1hq6535kv7l92", path = "res://packages/core.node" },
    { uid = "uid://6xwnsgn9562h", path = "res://packages/psyq.node" },
    { uid = "uid://1gge5rcau98eq", path = "res://packages/engine.node" },
    { uid = "uid://1xmru45vx7ejy", path = "res://packages/gameplay.node" },
]

# The effects only the weapons draw: no files of its own, its modules under it (declarations/packages/weapons/effects.toml).
