# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[texture]
uid = "uid://jt07ifkroqz0"
template = "texture"
page = { slot = { uid = "uid://w22e86j5tdow", path = "res://engine/vram/actor_sheet.node" }, at = [0, 0] }
mode = "indexed_8bpp"
size = [256, 256]
palettes.default = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.node" }, at = [0, 0] }
palettes.default_2 = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.node" }, at = [0, 1] }
cells.page_0 = { rect = [0, 0, 128, 256], palette = "default" }
cells.page_1 = { rect = [128, 0, 128, 256], palette = "default_2" }

[texture.import]
importer = "pe2.images@ora"
source = "source.ora"

