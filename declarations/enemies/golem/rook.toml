# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[texture]
uid = "uid://bjnrctykk5po"
kind = "image"
role = "atlas"
page = { slot = { uid = "uid://w22e86j5tdow", path = "res://engine/vram/actor_sheet.asset" }, at = [0, 0] }
mode = "indexed_8bpp"
size = [384, 256]
palettes.default = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.asset" }, at = [0, 0] }
palettes.default_2 = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.asset" }, at = [0, 1] }
