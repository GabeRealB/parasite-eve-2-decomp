palettes = { default = "38c27be29b27fa2039d82c482ed018d160315b0a", default_2 = "4ab1ec0700b79aa4ef80a9519e0fc40393f7ddb6", default_3 = "05f0a4081527028f1f44f30dfbec6426960bfcbc" }
