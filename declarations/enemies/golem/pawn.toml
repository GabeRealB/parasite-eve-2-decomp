# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[texture]
uid = "uid://ehnqae93y99d"
template = "texture"
page = { slot = { uid = "uid://w22e86j5tdow", path = "res://engine/vram/actor_sheet.node" }, at = [0, 0] }
mode = "indexed_8bpp"
size = [384, 256]
palettes.default = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.node" }, at = [0, 0] }
palettes.default_2 = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.node" }, at = [0, 1] }
palettes.default_3 = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.node" }, at = [0, 2] }
cells.page_0 = { rect = [0, 0, 128, 256], palette = "default" }
cells.page_1 = { rect = [128, 0, 128, 256], palette = "default_2" }
cells.page_2 = { rect = [256, 0, 128, 256], palette = "default_3" }

[texture.import]
importer = "pe2.images@ora"
source = "source.ora"

[texture.from.USA]
at = [{ stage = 0, file = 102000, slot = "image", page = 0 }, { stage = 0, file = 105600, slot = "image", page = 0 }, { stage = 0, file = 202000, slot = "image", page = 0 }, { stage = 0, file = 205600, slot = "image", page = 0 }, { stage = 0, file = 302000, slot = "image", page = 0 }, { stage = 0, file = 305600, slot = "image", page = 0 }, { stage = 0, file = 535800, slot = "image", page = 0 }]
