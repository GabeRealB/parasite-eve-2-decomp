# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[preview]
uid = "uid://1e07drozcl8o6"
template = "texture"
page = { slot = { uid = "uid://xdefb7sjn2jj", path = "res://engine/vram/preview_picture.node" }, at = [0, 0] }
mode = "indexed_8bpp"
size = [128, 86]
palettes.default = { slot = { uid = "uid://1r4i1k0syt8ik", path = "res://engine/vram/preview_palette.node" }, at = [0, 0] }

[preview.import]
importer = "pe2.images@ora"
source = "source.ora"

[preview.from.USA]
