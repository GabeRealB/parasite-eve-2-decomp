# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[background]
uid = "uid://f1e963jhv4i4"
template = "background"
format = "bs"

[background.import]
source = "native.bs"

[background.from.USA]
at = [{ stage = 0, file = 2, slot = "background" }]
sha1 = "51e3bfec6e0392baacaf9e9e9d3cf8054db030db"

[chrome_left]
