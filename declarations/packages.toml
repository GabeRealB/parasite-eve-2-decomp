# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); these are packages, which it finds on no disc:
# what a package is built from, as CMake lists a target's, its paths relative to the folder of its name. A target adds to it under
# target.<name>, its lists appended and its other values replacing.

[title]
uid = "uid://pc4ree5f63i7"
template = "package"
sources = ["src/*.c", "!src/*.inc.c"]
public = ["include"]
dependencies = [
    { uid = "uid://1hq6535kv7l92", path = "res://packages/core.node" },
    { uid = "uid://1gge5rcau98eq", path = "res://packages/engine.node" },
    { uid = "uid://6xwnsgn9562h", path = "res://packages/psyq.node" },
]
bind.chrome = { uid = "uid://ise7wq932mjc", path = "res://title/chrome.node" }
bind.demos = { uid = "uid://6p4qnxbnkvf7", path = "res://attract_demos/demos.node" }
bind.screen = { uid = "uid://1ri4tekdefv04", path = "res://stage0/system.node", output = "files/title_screen" }
bind.menu = { uid = "uid://1cjow36nol6rd", path = "res://stage0/items.node", output = "files/options" }
bind.file = { uid = "uid://swvvgzpql4fk", path = "res://stage0/system/title.node" }

[title.target.psx]
slot = "resident"
link_script = "psx/link.ld"

# Packages with nothing of their own to build: what others include, and what they publish to link against.

[core]
uid = "uid://1hq6535kv7l92"
template = "library"
public = ["include"]

# Sony's SDK, as the game links it: its headers, and of its libraries the members the executable links, each converted from
# the SDK's object - but libsn's start-up, which no ELF object can hold: its reconstruction is a source, compiled with the
# package (lib/versions.txt).
[psyq]
uid = "uid://6xwnsgn9562h"
template = "library"
public = ["include"]

[psyq.target.psx]
sources = ["lib/libsn/snmain.s"]
objects = ["lib/*/*.o"]

# The GTE's commands as real COP2 instructions: what Sony's DMPSX made of the SDK's placeholder words, which no tool of
# this build runs. It keeps the SDK's macro names, so the SDK's compound macros reach it too.
[math]
uid = "uid://11pxyk2e9y3yt"
template = "library"
public = ["include"]
dependencies = [
    { uid = "uid://6xwnsgn9562h", path = "res://packages/psyq.node" },
]

[engine]
uid = "uid://1gge5rcau98eq"
template = "library"
public = ["include"]
dependencies = [
    { uid = "uid://1hq6535kv7l92", path = "res://packages/core.node" },
    { uid = "uid://1xmru45vx7ejy", path = "res://packages/gameplay.node" },
    { uid = "uid://11pxyk2e9y3yt", path = "res://packages/math.node" },
    { uid = "uid://6xwnsgn9562h", path = "res://packages/psyq.node" },
]

[engine.target.psx]
symbols = "psx/symbols.ld"

[gameplay]
uid = "uid://1xmru45vx7ejy"
template = "library"
public = ["include"]
dependencies = [
    { uid = "uid://1hq6535kv7l92", path = "res://packages/core.node" },
    { uid = "uid://1gge5rcau98eq", path = "res://packages/engine.node" },
    { uid = "uid://6xwnsgn9562h", path = "res://packages/psyq.node" },
]

[gameplay.target.psx]
symbols = "psx/symbols.ld"

[aya]
uid = "uid://upo6m0w1osm2"
template = "library"
public = ["include"]
dependencies = [
    { uid = "uid://1hq6535kv7l92", path = "res://packages/core.node" },
    { uid = "uid://1gge5rcau98eq", path = "res://packages/engine.node" },
    { uid = "uid://1xmru45vx7ejy", path = "res://packages/gameplay.node" },
]

