# The Parasite Energies: no files of its own, its packages under it (declarations/packages/pe.toml), and the code only they
# share (pe/effects).
[pe]
uid = "uid://pcgx887q8684"
template = "library"

# The overlays' copies of full-screen code - fades, negative, frame capture, screen waves: no files of its own, the
# modules under it (declarations/packages/screen.toml) one library each.
[screen]
uid = "uid://1kwwfpbkqh84r"
template = "library"

# The overlays' copies of effect drawing - glows, sprite quads, flames, water, beams: no files of its own, the modules
# under it (declarations/packages/effects.toml) one library each, as fragments a package includes where its copy sits.
[effects]
uid = "uid://1upb7tm54phai"
template = "library"

