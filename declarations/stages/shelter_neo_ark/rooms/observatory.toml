# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[dome_backdrop]
uid = "uid://js1xp03ddktk"
template = "texture"
page = { slot = { uid = "uid://w22e86j5tdow", path = "res://engine/vram/actor_sheet.node" }, at = [0, 0] }
mode = "indexed_8bpp"
size = [640, 240]
palettes.outgoing = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.node" }, at = [0, 0] }
palettes.incoming = { slot = { uid = "uid://m7hcmgasvw3o", path = "res://engine/vram/actor_palettes.node" }, at = [0, 1] }
cells.page_0 = { rect = [0, 0, 128, 240], palette = "outgoing" }
cells.page_1 = { rect = [128, 0, 128, 240], palette = "outgoing" }
cells.page_2 = { rect = [256, 0, 128, 240], palette = "outgoing" }
cells.page_3 = { rect = [384, 0, 128, 240], palette = "incoming" }
cells.page_4 = { rect = [512, 0, 128, 240], palette = "incoming" }
variants.incoming = { palettes = { page_2 = "incoming" } }

[dome_backdrop.import]
importer = "pe2.images@ora"
source = "source.ora"

