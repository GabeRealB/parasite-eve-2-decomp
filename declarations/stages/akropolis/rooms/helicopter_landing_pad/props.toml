# Declarations: where extraction finds each asset on the discs (pe2-cli project extract); slots name the assets that fill them.

[lift_page]
uid = "uid://1uimpwyaq8b9b"
template = "texture"
page = { slot = { uid = "uid://xi3z21iyfb30", path = "res://engine/vram/room_sprite_sheet.node" }, at = [0, 0] }
mode = "indexed_4bpp"
size = [256, 256]
palettes.lift = { slot = { uid = "uid://1gp7leszhiipc", path = "res://engine/vram/effect_palettes.node" }, at = [0, 2] }
palettes.cable = { slot = { uid = "uid://1gp7leszhiipc", path = "res://engine/vram/effect_palettes.node" }, at = [0, 3] }
cells.lift = { rect = [0, 0, 128, 192], palette = "lift", mode = "indexed_8bpp" }
cells.cable = { rect = [0, 248, 24, 8], palette = "cable" }

[lift_page.import]
importer = "pe2.images@ora"
source = "source.ora"

[lift_page.from.USA]
