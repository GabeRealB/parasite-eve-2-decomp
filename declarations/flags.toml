uid = "uid://wg0vt4ft4kfl"
template = "flag_registry"
description = "Akropolis and the MIST, stage 1: its routes, scenes and doors."

[akropolis.flag.cafeteria_route_progress]
id = 0x000
kind = "state"
description = "The route through the cafeteria. The square refuses both elevators from boss_defeated; the patio, hallway, cafeteria, fountain and forked-road doors answer by it."
values = { not_started = 0, entered_akropolis = 1, boss_defeated = 2, mist_contacted = 3, fountain_unlocked = 5 }
verified = true

[akropolis.flag.sanctuary_route_progress]
