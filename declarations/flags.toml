# Declarations: the game flag bank's flags by name (pe2.flags), written by hand. A flag is listed once its meaning has
# been checked against the code that reads and writes it (packages/engine/include/event_flags.h holds the same, for the
# code, until packages read these); an ID has one owner across every registry.

# The game's own mechanisms: what every stage, the map and the load screen read.
[game]
uid = "uid://hurgb6azdj53"
template = "flag_registry"
description = "The game's own mechanisms: the story's progress, the telephone, the map, and what the bank keeps besides flags."

[game.flag.telephone_dialogue_counter]
id = 0x003
kind = "counter"
description = "The counter of the story call's CAP command (16 + story_dialogue_index), raised each time the phone is used: it picks the call's variant, so a repeat plays a shorter one. Cleared whenever the story index changes. At story dialogue 0xE, the room's cutscene task uses 1 and 2 for its looping choice instead."
values = { unheard = 0, loop_active = 1, loop_done = 2 }
verified = true

[game.flag.map_akropolis_available]
id = 0x015
kind = "marker"
description = "The Akropolis map can be shown: written by the Akropolis square and the patio, read by the map menu."
verified = true

[game.flag.play_time]
id = 0x068
count = 4
kind = "reserved"
description = "Not a flag: the bank keeps the captured play time here, minutes as a halfword (the bank's playTimeMark)."
verified = true

[game.flag.story_chapter]
id = 0x07A
kind = "state"
description = "The story chapter, set as each stage begins: what the boot captions, the music, room variants and cutscene choices go by."
values = { mist_arrival = 0, akropolis = 1, dryfield = 2, dryfield_night = 3, dryfield_night_end = 4, shelter = 5, shelter_1f_bulwark = 6 }
verified = true

[game.flag.current_objective]
id = 0x0A2
kind = "packed"
description = "The current objective, a whole byte: what the map marks and what its Help panel says (stage 0's file 20800 + the objective)."
values = { akropolis_entered = 0x01, akropolis_cafeteria_key_received = 0x02, akropolis_cafeteria_boss_killed = 0x03, akropolis_cafeteria_boss_examined = 0x04, mist_contacted = 0x05, akropolis_sanctuary_entered = 0x06, akropolis_roof_garden_bomb_seen = 0x07, akropolis_no9_defeated = 0x08, dryfield_arrived = 0x09, mist_shooting_gallery_start = 0x3A, mist_shooting_gallery_briefed = 0x3B, mist_returned = 0x3C }
verified = true

[game.flag.story_dialogue_index]
id = 0x155
kind = "state"
description = "The telephone call to play next (0..0xF): the call is CAP command 16 + the index in the stage's call file. Story beats raise it, each clearing telephone_dialogue_counter; a stage start resets it to 0; 0xE adds a looping choice. Each stage's calls are its own, so its values are named by the stage's registry."
verified = true

# Akropolis and the MIST: the stage's own flags, its map doors among them.
